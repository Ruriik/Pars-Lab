<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PARS LAB // Siber Güvenlik & Eğitim Platformu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px;">
    
    <!-- Modern Branding -->
    <div class="logo-container">
      <img src="/assets/Pars.png" alt="Pars Lab Logo" class="pars-logo" id="mainLogo" onerror="this.style.display='none'">
      <h1 class="brand-title">PARS LAB</h1>
    </div>

    <!-- Main SaaS Entry Card -->
    <div class="cyber-card">
      <div class="cyber-card-header">
        <span class="cyber-tag">ÖĞRENCİ PORTALI</span>
        <span style="font-size: 0.8rem; color: var(--text-dim); font-weight: 500;">CANLI QUIZ</span>
      </div>

      <form id="joinForm">
        <div style="margin-bottom: 20px;">
          <label style="font-size: 0.8rem; font-weight: 600; display: block; margin-bottom: 8px; color: var(--text-secondary); letter-spacing: 0.02em;">
            ODA PIN KODU (6 HANELİ)
          </label>
          <input type="text" id="pinInput" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" placeholder="000 000" autocomplete="off" required>
        </div>

        <div style="margin-bottom: 24px;">
          <label style="font-size: 0.8rem; font-weight: 600; display: block; margin-bottom: 8px; color: var(--text-secondary); letter-spacing: 0.02em;">
            ÖĞRENCİ / TAKMA AD
          </label>
          <input type="text" id="nicknameInput" maxlength="15" placeholder="Pars_User" autocomplete="off" required>
        </div>

        <button type="submit" id="btnJoin" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1rem;">
          Laboratuvara Katıl
        </button>

        <div id="alertBox" class="alert-box"></div>
      </form>

      <div style="margin-top: 28px; border-top: 1px solid var(--border-subtle); padding-top: 20px; text-align: center;">
        <p style="font-size: 0.78rem; font-weight: 600; color: var(--text-dim); margin-bottom: 12px; letter-spacing: 0.04em; text-transform: uppercase;">
          Eğitmen / Akıllı Tahta Görünümü
        </p>
        <a href="/host.html" class="btn btn-secondary" style="width: 100%; display: inline-flex; text-decoration: none;">
          Host Ekranını Başlat &rarr;
        </a>
      </div>
    </div>

  </div>

  <script>
    const form = document.getElementById('joinForm');
    const pinInput = document.getElementById('pinInput');
    const nickInput = document.getElementById('nicknameInput');
    const alertBox = document.getElementById('alertBox');
    const btnJoin = document.getElementById('btnJoin');

    // Auto-focus PIN
    pinInput.focus();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.className = 'alert-box';
      alertBox.style.display = 'none';

      const pin = pinInput.value.trim().replace(/\s+/g, '');
      const nickname = nickInput.value.trim();

      if (!/^\d{6}$/.test(pin)) {
        showAlert('Hata: PIN tam 6 haneli rakam olmalıdır.', 'error');
        return;
      }

      if (!nickname || nickname.length < 2) {
        showAlert('Hata: Takma ad en az 2 karakter olmalıdır.', 'error');
        return;
      }

      btnJoin.disabled = true;
      btnJoin.textContent = 'Bağlanılıyor...';

      try {
        // Pre-validate PIN against server rate limiter
        const res = await fetch('/api/check-pin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin })
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          showAlert(data.error || 'Oda doğrulanamadı.', 'error');
          btnJoin.disabled = false;
          btnJoin.textContent = 'Laboratuvara Katıl';
          return;
        }

        // Redirect to mobile player interface with credentials
        sessionStorage.setItem('pars_pin', pin);
        sessionStorage.setItem('pars_nick', nickname);
        window.location.href = `/mobile.html?pin=${encodeURIComponent(pin)}&nick=${encodeURIComponent(nickname)}`;

      } catch (err) {
        showAlert('Sunucu bağlantı hatası. Lütfen ağınızı kontrol edin.', 'error');
        btnJoin.disabled = false;
        btnJoin.textContent = 'Laboratuvara Katıl';
      }
    });

    function showAlert(msg, type) {
      alertBox.textContent = msg;
      alertBox.className = `alert-box alert-${type}`;
      alertBox.style.display = 'block';
    }
  </script>
</body>
</html>
